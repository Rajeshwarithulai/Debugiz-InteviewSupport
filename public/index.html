<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Debugiz Technologies · Interview Tracker</title>
<link rel="icon" type="image/png" href="/assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />

<body>

<div class="app">

  <main class="content">

    <!-- ============ ADD INTERVIEW (only screen for now) ============ -->
    <section id="view-add" class="view">

      <div class="shell">

        <aside class="shell__brand">
          <div class="shell__blob shell__blob--a" aria-hidden="true"></div>
          <div class="shell__blob shell__blob--b" aria-hidden="true"></div>
          <div class="shell__blob shell__blob--c" aria-hidden="true"></div>

          <div class="shell__brand-top">
            <div class="shell__logo-wrap">
              <img class="shell__logo" src="/assets/logo.png" alt="Debugiz Technologies" />
            </div>
            <h1 class="shell__company">Debugiz <span class="shell__company-break">Technologies</span></h1>
            <p class="shell__tagline"></p>
          </div>

          <div class="shell__status">
            <span id="connDot" class="dot dot--off"></span>
            <span id="connLabel">connecting…</span>
          </div>
        </aside>

        <div class="shell__form-wrap">

          <!-- FORM STATE -->
          <form id="interviewForm" class="form" enctype="multipart/form-data">
            <p class="form__eyebrow">New record</p>
            <h1 class="form__title">Add Interview</h1>
            <p class="form__subtitle">Log candidate details as soon as an interview is scheduled.</p>

            <div class="field">
              <label for="candidateName">Candidate name</label>
              <div class="input-icon">
                <svg class="input-icon__glyph" viewBox="0 0 20 20" fill="none"><path d="M10 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm0 1.5c-3 0-6.5 1.5-6.5 4v1.5h13V15.5c0-2.5-3.5-4-6.5-4Z" fill="currentColor"/></svg>
                <input type="text" id="candidateName" name="candidateName" required placeholder="e.g. Raji" autocomplete="off" />
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <div class="input-icon">
                <svg class="input-icon__glyph" viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 6 10 11l7.5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="email" id="email" name="email" required placeholder="candidate@example.com" autocomplete="off" />
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="supportingBy">Supporting by</label>
                <select id="supportingBy" name="supportingBy" required>
                  <option value="" disabled selected>Select supporting person</option>
                </select>
              </div>

              <div class="field">
                <label for="hiredBy">Hired by</label>
                <select id="hiredBy" name="hiredBy" required>
                  <option value="" disabled selected>Select hiring person</option>
                </select>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="candidateMailAttachment">Candidate mail attachment</label>
                <label class="file-drop" for="candidateMailAttachment">
                  <span class="file-drop__text" data-default="Choose a file">Choose a file</span>
                  <input type="file" id="candidateMailAttachment" name="candidateMailAttachment" />
                </label>
              </div>

              <div class="field">
                <label for="interviewSnapshot">Interview link mail snapshot</label>
                <label class="file-drop" for="interviewSnapshot">
                  <span class="file-drop__text" data-default="Choose an image">Choose an image</span>
                  <input type="file" id="interviewSnapshot" name="interviewSnapshot" accept="image/*" />
                </label>
              </div>
            </div>

            <div class="form__actions">
              <button type="reset" class="btn btn--ghost" id="resetBtn">Clear</button>
              <button type="submit" class="btn btn--primary" id="submitBtn">
                <span>Save interview</span>
              </button>
            </div>

            <p class="form__message" id="formMessage" role="status"></p>
          </form>

          <!-- SUCCESS STATE -->
          <div class="confirm view--hidden" id="confirmState">
            <div class="stamp" aria-hidden="true">
              <svg viewBox="0 0 120 120" class="stamp__svg">
                <circle cx="60" cy="60" r="54" class="stamp__ring" />
                <circle cx="60" cy="60" r="44" class="stamp__ring stamp__ring--inner" />
                <path id="stampCheck" class="stamp__check" d="M40 61 L53 74 L82 44" />
              </svg>
            </div>
            <h2 class="confirm__title"> Interview Successfully Logged</h2>
            <p class="confirm__name" id="confirmName"></p>
            <p class="confirm__meta"></p>
            <button type="button" class="btn btn--primary" id="logAnotherBtn">Log another interview</button>
          </div>

        </div>
      </div>
    </section>
